# CI for MinXLSX: lint + test + build on Linux and Windows for every push/PR.
# Pushing a tag like v1.0.0 also publishes both executables to a GitHub Release.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch: a new push (or the PR for the same branch) cancels the
# older run. Runs on main are never cancelled, so every main build finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CGO_ENABLED: "1" # Fyne needs cgo (OpenGL)
  # Every go command (vet, test, lint, the final build) uses the same flags,
  # so they share one build cache and Fyne's C code is compiled only once.
  GOFLAGS: -trimpath

jobs:
  check:
    name: check (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 on purpose: the binary needs this glibc or newer, so an
          # older build host means it runs on more Linux distros.
          - os: ubuntu-22.04
            bin: minxlsx
          - os: windows-latest
            bin: minxlsx.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # same scripts on both OSes (Git Bash on Windows)
    steps:
      - uses: actions/checkout@v7

      # Go version comes from go.mod. Caching is done below instead of here:
      # setup-go's cache keeps one entry per go.sum and never refreshes it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # Fyne's C dependencies on Linux.
      - name: Install Fyne deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      # cgo gcc on Windows: MinGW-w64 (UCRT64) from MSYS2, put first on PATH.
      - name: Install MinGW-w64 gcc (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add MinGW-w64 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
      - name: Show gcc
        run: gcc --version

      # Go build + module cache. A new entry is saved after every run (key ends
      # in the run id) and restored from the newest match, so it never goes stale.
      - name: Find Go cache dirs
        id: goenv
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.goenv.outputs.gocache }}
            ${{ steps.goenv.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # pinned; Go 1.27 support needs v2.13.0+

      - name: go test
        run: go test ./...

      # Build the portable executable (stripped; no console window on Windows).
      # -ldflags only changes linking, so compiled packages come from the cache.
      - name: Build ${{ matrix.bin }}
        run: |
          ldflags="-s -w"
          if [ "$RUNNER_OS" = "Windows" ]; then ldflags="$ldflags -H=windowsgui"; fi
          GOARCH=amd64 go build -ldflags "$ldflags" -o "dist/${{ matrix.bin }}" ./cmd/minxlsx

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bin }}
          path: dist/${{ matrix.bin }}
          if-no-files-found: error

      # Save even when a check failed, so the next run doesn't recompile Fyne.
      - name: Save Go cache
        if: ${{ !cancelled() && steps.goenv.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.goenv.outputs.gocache }}
            ${{ steps.goenv.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Only on v* tags: attach both executables to a GitHub Release.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/minxlsx
            dist/minxlsx.exe
          generate_release_notes: true

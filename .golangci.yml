# golangci-lint v2 config. CI pins the version in .github/workflows/build.yml.
version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - errcheck   # ignored errors, e.g. from Close or Write on a file being saved
    - gosec      # file permissions, paths, unsafe calls
    - bodyclose  # unclosed HTTP response bodies
    - errorlint  # errors compared with == or type-asserted instead of errors.Is/As
  settings:
    errcheck:
      # `_ = f.Close()` fails too: an error from a file being saved must be
      # handled, not thrown away on purpose.
      check-blank: true
  exclusions:
    rules:
      # Tests may discard errors with `_ =` (e.g. closing a fixture they only
      # read). A plain unchecked call still fails in tests.
      - path: _test\.go
        linters: [errcheck]
        source: '(^|\s|\{\s*)_ = '
      # Tests read fixtures from computed paths, write them 0644 so they
      # stay readable in the repo, and chmod files to test read-only saves.
      # Production code gets every gosec rule.
      - path: _test\.go
        linters: [gosec]
        text: "G301|G302|G304|G306|G703"
